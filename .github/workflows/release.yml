name: Release

# Publishes vurses to npm when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0).
# Uses npm trusted publishing (OIDC): no npm token or one-time password is stored anywhere.
# The trusted publisher is configured on npmjs.com for this repository, this workflow file and
# the "npm" environment.

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual run: build, test and pack, without publishing

permissions:
  contents: write # creates the GitHub release for the tag
  id-token: write # lets npm verify that the package was built by this workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes list the commits since the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs npm 11.5.1 or newer
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: The tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci # also builds dist/ (prepare script)
      - run: npm run typecheck
      - run: npm run test:all

      - name: Check the package contents (manual runs)
        if: github.event_name != 'push'
        run: npm pack --dry-run

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish --access public

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            echo "Install: \`npm install vurses@${GITHUB_REF_NAME#v}\` · [npm](https://www.npmjs.com/package/vurses/v/${GITHUB_REF_NAME#v}) · [docs](https://marcuspuchalla.github.io/vurses/)"
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "${prev:+$prev..}$GITHUB_REF_NAME" | grep -v '^- release: '
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "vurses $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

